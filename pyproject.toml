[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "fullremote-mcp"
version = "0.1.0"
description = "A Python MCP server for operating an interactive Windows VM."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.11"
dependencies = [
  "mcp>=1.20,<2",
  "anyio>=4.8,<5",
  "starlette>=0.49,<1",
  "uvicorn>=0.34,<1",
  "Pillow>=11,<13",
  "psutil>=7,<8",
  "python-dotenv>=1,<2",
  "pywin32>=308; sys_platform == 'win32'",
  "pywinauto>=0.6.9,<0.7; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = ["httpx>=0.28,<1", "ruff>=0.11,<1"]
build = ["pyinstaller>=6.16,<7"]

[project.scripts]
fullremote-mcp = "fullremote_mcp.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/fullremote_mcp"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
